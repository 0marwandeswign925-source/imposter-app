<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج التصويت</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg,#1f083d,#6a1a8e);
    color:#fff;
    min-height:100vh;
    padding:20px;
    direction: rtl;
}

h2 { margin-bottom: 20px; }

.result {
    background: rgba(0,0,0,0.35);
    margin: 10px auto;
    padding: 15px;
    border-radius: 12px;
    font-size: 20px;
    max-width: 400px;
}

.result b { color: #ffeb3b; }

.imposter {
    margin-top: 25px;
    font-size: 24px;
    color: #ff5252;
}

button {
    padding:12px 25px;
    font-size:18px;
    margin-top:25px;
    cursor:pointer;
    border-radius:10px;
    border:none;
    background:#4CAF50;
    color:#fff;
    font-weight:bold;
}

button:hover { background:#45a049; }
</style>
</head>

<body>

<h2>🔥 نتائج التصويت 🔥</h2>
<div id="results"></div>

<button onclick="restart()">إعادة اللعبة</button>

<script>
const resultsDiv = document.getElementById("results");

// ======== تحميل البيانات ========
let imposters = JSON.parse(localStorage.getItem("imposters") || "[]");
let scores = JSON.parse(localStorage.getItem("scores") || "{}");

// ======== عرض النتائج ========
if(Object.keys(scores).length === 0){
    resultsDiv.innerHTML = "<i>مفيش نقاط مسجلة 🤷‍♂️</i>";
} else {
    Object.entries(scores)
        .sort((a,b)=>b[1]-a[1]) // ترتيب حسب النقاط من الأعلى
        .forEach(([name,score])=>{
            const div = document.createElement("div");
            div.className = "result";
            div.innerHTML = `<b>${name}</b> — النقاط: ${score}`;
            resultsDiv.appendChild(div);
        });
}

// عرض الإمبوسترات الحقيقيين
const impDiv = document.createElement("div");
impDiv.className = "imposter";
impDiv.innerHTML = `
👿 الإمبوستر الحقيقي هو:<br>
<b>${imposters.length ? imposters.join(" ، ") : "غير محدد"}</b>
`;
resultsDiv.appendChild(impDiv);

// إعادة اللعبة
function restart(){
    if(confirm("هتمسح كل البيانات وتبدأ من جديد؟")){
        localStorage.clear();
        window.location.href = "index.html";
    }
}
</script>

</body>
</html>
